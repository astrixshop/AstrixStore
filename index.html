<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRYX Store</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green:#25D366;
  --green-dark:#1aaa4f;
  --bg:#fff;
  --text:#111;
  --text-muted:#888;
  --border:#eee;
  --card-shadow:0 4px 24px rgba(0,0,0,0.08);
}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}

/* ─── NAVBAR ─── */
.navbar{
  background:#fff;
  border-bottom:2px solid var(--green);
  position:sticky;top:0;z-index:200;
}
.navbar-top{
  padding:16px 24px;
  display:flex;justify-content:center;align-items:center;
}
.logo{
  font-family:'Bebas Neue',cursive;
  font-size:2.2rem;letter-spacing:8px;color:var(--green);
  text-decoration:none;
}

/* ─── CATEGORY NAV ─── */
.cat-nav{
  display:flex;
  gap:4px;
  overflow-x:auto;
  padding:0 16px 12px;
  scrollbar-width:none;
  justify-content:center;
  flex-wrap:wrap;
}
.cat-nav::-webkit-scrollbar{display:none;}
.cat-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;
  border:1.5px solid var(--border);
  border-radius:100px;
  padding:8px 18px;
  font-family:'DM Sans',sans-serif;
  font-size:0.82rem;
  font-weight:600;
  color:var(--text-muted);
  cursor:pointer;
  white-space:nowrap;
  transition:all 0.2s ease;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
.cat-btn:hover{
  border-color:var(--green);color:var(--green);
}
.cat-btn.active{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}
.cat-btn.hidden-cat{display:none;}

/* ─── HERO ─── */
.hero{
  text-align:center;
  padding:36px 20px 12px;
}
.hero-title{
  font-family:'Bebas Neue',cursive;
  font-size:3rem;letter-spacing:6px;
  line-height:1;
  margin-bottom:8px;
}
.hero-sub{color:var(--text-muted);font-size:0.95rem;}

/* ─── SECTION TITLES ─── */
.section-wrap{
  max-width:1300px;margin:auto;padding:0 20px 60px;
}
.section-header{
  display:flex;align-items:center;gap:14px;
  padding:32px 0 24px;
}
.section-icon{font-size:1.5rem;}
.section-title{
  font-family:'Bebas Neue',cursive;
  font-size:1.8rem;letter-spacing:4px;
  color:var(--text);
}
.section-line{flex:1;height:1.5px;background:var(--border);}

/* ─── GRID ─── */
.products-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}

/* ─── CARD ─── */
.product-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:var(--card-shadow);
  transition:transform 0.25s ease, box-shadow 0.25s ease;
  position:relative;
}
.product-card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 40px rgba(0,0,0,0.13);
}
.product-image{
  width:100%;height:320px;object-fit:cover;
  background:#f5f5f5;
  display:block;
}
.product-info{padding:16px;}
.product-tag{
  display:inline-block;
  font-size:0.72rem;font-weight:700;
  color:var(--green);
  letter-spacing:0.5px;
  text-transform:uppercase;
  margin-bottom:6px;
}
.product-name{
  font-weight:700;font-size:1rem;
  margin-bottom:8px;line-height:1.3;
}
.product-price{
  font-size:1.25rem;font-weight:700;
  color:var(--green);margin-bottom:14px;
}
.whatsapp-btn{
  width:100%;
  background:var(--green);
  color:#fff;border:none;
  padding:12px;border-radius:12px;
  font-weight:700;cursor:pointer;
  font-size:0.9rem;
  font-family:'DM Sans',sans-serif;
  letter-spacing:0.5px;
  transition:background 0.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.whatsapp-btn:hover{background:var(--green-dark);}
.whatsapp-btn:disabled{
  background:#ccc;cursor:not-allowed;color:#fff;
}
.badge-agotado{
  position:absolute;top:12px;left:12px;
  background:#ff3b30;color:#fff;
  padding:5px 12px;border-radius:100px;
  font-size:0.72rem;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;
}

/* ─── ALL CATEGORIES VIEW ─── */
.all-categories .section-block{margin-bottom:20px;}
.cat-section{display:none;}
.cat-section.visible{display:block;}

/* ─── EMPTY ─── */
.empty-state{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);font-size:0.95rem;
}

/* ─── LOADING ─── */
.loading-wrap{
  text-align:center;padding:80px 20px;
}
.spinner{
  width:40px;height:40px;
  border:3px solid var(--border);
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ─── FOOTER ─── */
footer{
  background:#f9f9f9;
  border-top:1px solid var(--border);
  text-align:center;
  padding:32px 20px;
  font-size:0.82rem;
  color:var(--text-muted);
  font-family:'DM Sans',sans-serif;
}
footer strong{color:var(--green);}

/* ─── LIGHTBOX ─── */
.lightbox{
  display:none;
  position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,0.92);
  justify-content:center;align-items:center;
  cursor:zoom-out;
  animation:lbIn 0.2s ease;
}
.lightbox.open{display:flex;}
@keyframes lbIn{from{opacity:0;}to{opacity:1;}}
.lightbox img{
  max-width:92vw;max-height:88vh;
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 8px 60px rgba(0,0,0,0.6);
  animation:lbZoom 0.2s ease;
}
@keyframes lbZoom{from{transform:scale(0.92);}to{transform:scale(1);}}
.lightbox-close{
  position:fixed;top:18px;right:22px;
  color:#fff;font-size:2rem;cursor:pointer;
  background:rgba(0,0,0,0.5);border-radius:50%;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  line-height:1;
}

/* ─── RESPONSIVE ─── */
@media(max-width:600px){
  .hero-title{font-size:2.2rem;}
  .products-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .product-image{height:220px;}
  .cat-btn{padding:7px 14px;font-size:0.75rem;}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-top">
    <div>
      <a class="logo" href="#">ASTRYX</a>
      <div style="text-align:center;font-size:0.75rem;color:var(--green);letter-spacing:2px;font-weight:700;margin-top:2px;">Hacemos delivery 🛵</div>
    </div>
  </div>
  <div class="cat-nav" id="catNav">
    <!-- Botones generados dinámicamente -->
  </div>
</nav>

<div class="section-wrap">
  <div class="loading-wrap" id="loadingState">
    <div class="spinner"></div>
    <p>Cargando productos...</p>
  </div>

  <!-- Secciones por categoría -->
  <div id="categorySections"></div>
</div>

<footer>
  <strong>ASTRYX Store</strong> &nbsp;•&nbsp; Hacemos delivery 🛵 &nbsp;•&nbsp; Todos los precios en Gs.
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-close">✕</div>
  <img id="lightboxImg" src="" alt="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Obfuscated config (igual que el original)
function xd(a,k){var r="";for(var i=0;i<a.length;i++){r+=String.fromCharCode(a[i]^k.charCodeAt(i%k.length));}return r;}
var K="AstryxK3y!2026";
var cfg={
  apiKey:xd([0,58,14,19,42,1,9,74,22,21,31,3,6,85,10,10,44,56,61,61,126,2,44,71,74,72,87,78,13,69,63,51,78,42,41,93,33,109,103],K),
  authDomain:xd([32,0,0,0,16,0,56,71,22,83,87,29,84,82,119,17,23,92,31,17,57,86,27,64,65,85,83,70,49,93,23,29,20],K),
  projectId:xd([32,0,0,0,16,0,56,71,22,83,87,29,84,82,119,17,23],K),
  storageBucket:xd([32,0,0,0,16,0,56,71,22,83,87,29,84,82,119,17,23,92,31,17,57,86,27,64,65,85,65,66,46,1,21,21,28,86,42,67,9],K),
  messagingSenderId:xd([116,75,66,64,76,78,126,2,78,22,3,2],K),
  appId:xd([112,73,65,74,79,74,126,5,76,16,5,7,3,4,123,4,17,16,67,79,125,4,72,16,11,81,11,87,121,23,17,71,77,26,124,82,73,16,84,5,7],K)
};
var WA=xd([116,74,65,66,64,64,126,4,77,22,1,4,3],K);

const app = initializeApp(cfg);
const db = getFirestore(app);

// ─── DEFINICIÓN DE CATEGORÍAS ───
const CATEGORIAS = [
  { id: "Remeras",       label: "Remeras",      icon: "👕", default: true },
  { id: "Shorts",        label: "Shorts",        icon: "🩳" },
  { id: "Boxers",        label: "Boxers",        icon: "🩲" },
  { id: "Pantalones",    label: "Pantalones",    icon: "👖" },
  { id: "Ropa Interior", label: "Ropa Interior", icon: "🧺" },
];

function generoSymbol(g){
  if(!g) return "";
  return g === "Mujer" ? " ♀️" : " ♂️";
}

// ─── ESTADO ───
let activeCategory = null;
let allProducts = [];

// ─── UTILIDADES ───
window.openLightbox = function(src, alt){
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightboxImg").alt = alt;
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
};
window.closeLightbox = function(){
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
};
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeLightbox();
});

window.sendWA = function(nombre, categoria, genero, imagen, sinPrecio, precio){
  var msg = "Hola! 👋 Me interesa este producto:\n\n";
  msg += "📦 *" + nombre + "*\n";
  if(categoria) msg += "🏷️ " + categoria + (genero ? " · " + genero : "") + "\n";
  if(sinPrecio){
    msg += "💰 Quiero saber el precio\n";
  } else if(precio){
    msg += "💰 Gs. " + Number(precio).toLocaleString("es-PY") + "\n";
  }
  if(imagen) msg += "\n🖼️ " + imagen;
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
};

function formatPrice(p){
  return "Gs. " + Number(p).toLocaleString("es-PY");
}

// ─── RENDER CARD ───
function renderCard(p){
  const card = document.createElement("div");
  card.className = "product-card";

  if(p.agotado){
    const badge = document.createElement("div");
    badge.className = "badge-agotado";
    badge.textContent = "AGOTADO";
    card.appendChild(badge);
  }

  const img = document.createElement("img");
  img.className = "product-image";
  img.src = p.imagen || "https://via.placeholder.com/260x320";
  img.alt = p.nombre;
  img.loading = "lazy";
  img.style.cursor = "zoom-in";
  img.onclick = function(){ openLightbox(this.src, p.nombre); };
  img.onerror = function(){ this.src="https://via.placeholder.com/260x320"; };
  card.appendChild(img);

  const info = document.createElement("div");
  info.className = "product-info";

  // Tag tipo + género
  const tag = document.createElement("div");
  tag.className = "product-tag";
  tag.textContent = (p.categoria || "") + generoSymbol(p.genero);

  const name = document.createElement("div");
  name.className = "product-name";
  name.textContent = p.nombre;

  const price = document.createElement("div");
  price.className = "product-price";
  if(p.sinPrecio){
    price.textContent = "Consultar precio";
    price.style.color = "#888";
    price.style.fontSize = "0.95rem";
  } else {
    price.textContent = formatPrice(p.precio);
  }

  const btn = document.createElement("button");
  btn.className = "whatsapp-btn";
  btn.disabled = p.agotado;

  if(p.agotado){
    btn.textContent = "Producto agotado";
  } else if(p.sinPrecio){
    btn.innerHTML = "💬 Consultar por WhatsApp";
    btn.onclick = () => sendWA(p.nombre, p.categoria, p.genero, p.imagen, true, null);
  } else {
    btn.innerHTML = "💬 Escribir al WhatsApp";
    btn.onclick = () => sendWA(p.nombre, p.categoria, p.genero, p.imagen, false, p.precio);
  }

  info.appendChild(tag);
  info.appendChild(name);
  info.appendChild(price);
  info.appendChild(btn);
  card.appendChild(info);
  return card;
}

// ─── CONSTRUIR ESTRUCTURA ───
function buildSections(){
  const container = document.getElementById("categorySections");
  container.innerHTML = "";

  CATEGORIAS.forEach(cat => {
    const sec = document.createElement("div");
    sec.className = "cat-section";
    sec.id = "sec-" + cat.id;
    sec.dataset.catId = cat.id;

    const header = document.createElement("div");
    header.className = "section-header";
    header.innerHTML = `
      <span class="section-icon">${cat.icon}</span>
      <span class="section-title">${cat.label}</span>
      <div class="section-line"></div>
    `;

    const grid = document.createElement("div");
    grid.className = "products-grid";
    grid.id = "grid-" + cat.id;

    sec.appendChild(header);
    sec.appendChild(grid);
    container.appendChild(sec);
  });
}

// ─── CONSTRUIR NAV ───
function buildNav(withProducts){
  const nav = document.getElementById("catNav");
  nav.innerHTML = "";

  CATEGORIAS.forEach(cat => {
    const hasProds = withProducts.has(cat.id);
    if(!hasProds) return; // No aparece si no tiene productos

    const btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.dataset.catId = cat.id;
    btn.innerHTML = cat.icon + " " + cat.label;
    btn.onclick = () => showCategory(cat.id);
    nav.appendChild(btn);
  });
}

// ─── MOSTRAR CATEGORÍA ───
function showCategory(catId){
  activeCategory = catId;

  // Actualizar botones
  document.querySelectorAll(".cat-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.catId === catId);
  });

  // Mostrar/ocultar secciones
  document.querySelectorAll(".cat-section").forEach(sec => {
    sec.classList.toggle("visible", sec.dataset.catId === catId);
  });

  // Scroll suave al top
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ─── RELLENAR GRIDS ───
function fillGrids(products){
  CATEGORIAS.forEach(cat => {
    const grid = document.getElementById("grid-" + cat.id);
    if(!grid) return;
    const catProds = products.filter(p => p.categoria === cat.id);
    grid.innerHTML = "";
    if(catProds.length === 0){
      grid.innerHTML = '<div class="empty-state">No hay productos en esta categoría</div>';
    } else {
      catProds.forEach(p => grid.appendChild(renderCard(p)));
    }
  });
}

// ─── RENDER PRINCIPAL ───
function renderAll(products){
  allProducts = products;

  // Qué categorías tienen productos
  const withProducts = new Set(products.map(p => p.categoria));

  buildNav(withProducts);
  fillGrids(products);

  document.getElementById("loadingState").style.display = "none";

  // Si hay categorías con productos, mostrar la default si existe, sino la primera
  if(withProducts.size > 0){
    const defaultCat = CATEGORIAS.find(c => c.default && withProducts.has(c.id));
    const firstCat = CATEGORIAS.find(c => withProducts.has(c.id));
    const toShow = defaultCat ? defaultCat.id : (firstCat ? firstCat.id : null);
    if(toShow) showCategory(toShow);
  }
}

// ─── FIREBASE LISTENER ───
buildSections();

var loaded = false;

onSnapshot(collection(db, "productos"), function(qs){
  loaded = true;
  const products = [];
  qs.forEach(d => products.push({ id: d.id, ...d.data() }));
  renderAll(products);
}, function(e){
  loaded = true;
  document.getElementById("loadingState").innerHTML =
    '<p style="color:#ff3b30;padding:40px;">Error al cargar: '+e.message+'</p>';
});

setTimeout(function(){
  if(!loaded){
    document.getElementById("loadingState").innerHTML =
      '<p style="color:#888;padding:40px;">Sin conexión, recargá la página</p>';
  }
}, 8000);
</script>
