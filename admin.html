<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRYX Admin</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:30px;
color:#222;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 4px 15px rgba(0,0,0,0.06);
}

h1{
margin-bottom:20px;
color:#25D366;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
}

button{
border:none;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.save-btn{
background:#25D366;
color:white;
}

.delete-btn{
background:#ff3b30;
color:white;
}

table{
width:100%;
border-collapse:collapse;
}

th, td{
padding:15px;
border-bottom:1px solid #ddd;
text-align:left;
}

img{
width:70px;
height:70px;
object-fit:cover;
border-radius:10px;
}

.preview{
width:150px;
height:150px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
display:none;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Panel Admin ASTRYX</h1>

<form id="productForm">

<label>Imagen desde galería</label>
<input type="file" id="imageFile" accept="image/*" required>

<img id="preview" class="preview">

<label>Categoría</label>
<select id="categoria">
<option value="Camisetas">Camisetas</option>
<option value="Pantalones">Pantalones</option>
<option value="Chaquetas">Chaquetas</option>
</select>

<label>Precio</label>
<input type="number" id="precio" required>

<label>
<input type="checkbox" id="agotado">
Producto agotado
</label>

<br><br>

<button type="submit" class="save-btn">
Subir producto
</button>

</form>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Imagen</th>
<th>Nombre</th>
<th>Precio</th>
<th>Estado</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="productsTableBody"></tbody>

</table>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "TU_API_KEY",
authDomain: "TU_AUTH_DOMAIN",
projectId: "TU_PROJECT_ID",
storageBucket: "TU_STORAGE_BUCKET",
messagingSenderId: "TU_MESSAGING_SENDER_ID",
appId: "TU_APP_ID"
};

const GITHUB_TOKEN = "TU_GITHUB_TOKEN";
const GITHUB_USERNAME = "TU_USUARIO";
const GITHUB_REPO = "TU_REPO";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let productCount = 1;

const preview = document.getElementById("preview");

document.getElementById("imageFile")
.addEventListener("change", function(e){

const file = e.target.files[0];

if(file){

preview.src = URL.createObjectURL(file);
preview.style.display = "block";

}

});

async function uploadToGitHub(file, fileName){

const content = await fileToBase64(file);

const response = await fetch(
`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/images/${fileName}`,
{
method: "PUT",
headers: {
Authorization: `token ${GITHUB_TOKEN}`,
"Content-Type": "application/json"
},
body: JSON.stringify({
message: `upload ${fileName}`,
content: content
})
}
);

return `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/images/${fileName}`;

}

function fileToBase64(file){

return new Promise((resolve, reject) => {

const reader = new FileReader();

reader.readAsDataURL(file);

reader.onload = () => {
resolve(reader.result.split(",")[1]);
};

reader.onerror = error => reject(error);

});

}

async function loadProducts(){

const querySnapshot = await getDocs(collection(db, "productos"));

const tbody = document.getElementById("productsTableBody");

tbody.innerHTML = "";

let count = 1;

querySnapshot.forEach((documento) => {

const product = documento.data();

tbody.innerHTML += `

<tr>

<td>
<img src="${product.imagen}">
</td>

<td>${product.nombre}</td>

<td>$${product.precio}</td>

<td>${product.agotado ? 'Agotado' : 'Disponible'}</td>

<td>
<button
class="delete-btn"
onclick="deleteProduct('${documento.id}')"
>
Eliminar
</button>
</td>

</tr>

`;

count++;

});

productCount = count;

}

window.deleteProduct = async function(id){

if(!confirm("¿Eliminar producto?")) return;

await deleteDoc(doc(db, "productos", id));

loadProducts();

}

document.getElementById("productForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const file = document.getElementById("imageFile").files[0];

const nombreArchivo = `ropa-${productCount}.webp`;

const imageUrl = await uploadToGitHub(
file,
nombreArchivo
);

const productData = {

nombre: `ropa-${productCount}`,
categoria: document.getElementById("categoria").value,
precio: parseFloat(document.getElementById("precio").value),
imagen: imageUrl,
agotado: document.getElementById("agotado").checked

};

await addDoc(collection(db, "productos"), productData);

alert("Producto subido correctamente");

document.getElementById("productForm").reset();

preview.style.display = "none";

loadProducts();

});

loadProducts();

</script>

</body>
</html>
